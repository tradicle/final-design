<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 28px 'Microsoft YaHei'; fill:#1f2937}
      .entity{fill:#ffffff;stroke:#334155;stroke-width:2;rx:12;ry:12}
      .head{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
      .t1{font:700 22px 'Microsoft YaHei'; fill:#1e3a8a}
      .t2{font:18px 'Microsoft YaHei'; fill:#1f2937}
      .line{stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
      .label{font:18px 'Microsoft YaHei'; fill:#334155}
    </style>
  </defs>
  <text x="600" y="46" text-anchor="middle" class="title">数据库 E-R 关系图</text>

  <g transform="translate(60,120)">
    <rect width="220" height="160" class="entity"/>
    <rect width="220" height="38" class="head"/>
    <text x="110" y="26" text-anchor="middle" class="t1">SYS_USER</text>
    <text x="18" y="68" class="t2">id</text><text x="18" y="96" class="t2">username</text><text x="18" y="124" class="t2">role</text><text x="18" y="152" class="t2">create_time</text>
  </g>
  <g transform="translate(360,100)">
    <rect width="220" height="190" class="entity"/>
    <rect width="220" height="38" class="head"/>
    <text x="110" y="26" text-anchor="middle" class="t1">POST</text>
    <text x="18" y="68" class="t2">id</text><text x="18" y="96" class="t2">user_id</text><text x="18" y="124" class="t2">title</text><text x="18" y="152" class="t2">location</text><text x="18" y="180" class="t2">status</text>
  </g>
  <g transform="translate(680,100)">
    <rect width="220" height="190" class="entity"/>
    <rect width="220" height="38" class="head"/>
    <text x="110" y="26" text-anchor="middle" class="t1">COMMENT</text>
    <text x="18" y="68" class="t2">id</text><text x="18" y="96" class="t2">post_id</text><text x="18" y="124" class="t2">user_id</text><text x="18" y="152" class="t2">parent_id</text><text x="18" y="180" class="t2">status</text>
  </g>
  <g transform="translate(210,430)">
    <rect width="220" height="190" class="entity"/>
    <rect width="220" height="38" class="head"/>
    <text x="110" y="26" text-anchor="middle" class="t1">ANIMAL</text>
    <text x="18" y="68" class="t2">id</text><text x="18" y="96" class="t2">animal_no</text><text x="18" y="124" class="t2">name</text><text x="18" y="152" class="t2">status</text><text x="18" y="180" class="t2">location</text>
  </g>
  <g transform="translate(500,430)">
    <rect width="220" height="190" class="entity"/>
    <rect width="220" height="38" class="head"/>
    <text x="110" y="26" text-anchor="middle" class="t1">ADOPTION_APPLICATION</text>
    <text x="18" y="68" class="t2">id</text><text x="18" y="96" class="t2">animal_id</text><text x="18" y="124" class="t2">user_id</text><text x="18" y="152" class="t2">status</text><text x="18" y="180" class="t2">review_note</text>
  </g>
  <g transform="translate(790,430)">
    <rect width="220" height="160" class="entity"/>
    <rect width="220" height="38" class="head"/>
    <text x="110" y="26" text-anchor="middle" class="t1">ANIMAL_LOCATION</text>
    <text x="18" y="68" class="t2">id</text><text x="18" y="96" class="t2">animal_id</text><text x="18" y="124" class="t2">latitude</text><text x="18" y="152" class="t2">longitude</text>
  </g>

  <line x1="280" y1="200" x2="360" y2="195" class="line"/>
  <text x="305" y="186" class="label">1:N 发布</text>
  <line x1="280" y1="230" x2="680" y2="195" class="line"/>
  <text x="482" y="205" class="label">1:N 评论</text>
  <line x1="580" y1="195" x2="680" y2="195" class="line"/>
  <text x="615" y="183" class="label">1:N 包含</text>
  <line x1="260" y1="280" x2="560" y2="430" class="line"/>
  <text x="380" y="365" class="label">1:N 提交申请</text>
  <line x1="430" y1="520" x2="500" y2="520" class="line"/>
  <text x="448" y="506" class="label">1:N 被申请</text>
  <line x1="430" y1="550" x2="790" y2="510" class="line"/>
  <text x="612" y="542" class="label">1:N 位置记录</text>
</svg>
