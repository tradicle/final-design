<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#4a5568"/>
    </marker>
    <style>
      .title{font:700 28px 'Microsoft YaHei'; fill:#2d3748}
      .box{fill:#f8fafc;stroke:#475569;stroke-width:2;rx:12;ry:12}
      .db{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}
      .service{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .support{fill:#ecfeff;stroke:#0891b2;stroke-width:2}
      .text{font:24px 'Microsoft YaHei'; fill:#1f2937}
      .small{font:21px 'Microsoft YaHei'; fill:#1f2937}
      .line{stroke:#4a5568;stroke-width:3;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="600" y="55" text-anchor="middle" class="title">校园流浪动物救助与云领养管理平台总体架构</text>
  <rect x="60" y="270" width="170" height="80" class="box"/>
  <text x="145" y="318" text-anchor="middle" class="text">普通用户/管理员</text>
  <rect x="290" y="270" width="190" height="80" class="box"/>
  <text x="385" y="318" text-anchor="middle" class="text">Vue3 前端</text>
  <rect x="540" y="250" width="210" height="120" class="service"/>
  <text x="645" y="292" text-anchor="middle" class="text">Spring Boot 后端</text>
  <text x="645" y="328" text-anchor="middle" class="small">Controller / Service</text>
  <rect x="820" y="270" width="170" height="80" class="box"/>
  <text x="905" y="318" text-anchor="middle" class="text">Mapper 层</text>
  <ellipse cx="1080" cy="310" rx="90" ry="52" class="db"/>
  <text x="1080" y="320" text-anchor="middle" class="text">MySQL 数据库</text>
  <rect x="560" y="470" width="170" height="62" class="support"/>
  <text x="645" y="508" text-anchor="middle" class="text">Session 会话</text>
  <rect x="790" y="470" width="200" height="62" class="support"/>
  <text x="890" y="508" text-anchor="middle" class="text">uploads 资源目录</text>
  <rect x="290" y="470" width="190" height="62" class="support"/>
  <text x="385" y="508" text-anchor="middle" class="text">百度地图服务</text>
  <line x1="230" y1="310" x2="290" y2="310" class="line"/>
  <line x1="480" y1="310" x2="540" y2="310" class="line"/>
  <line x1="750" y1="310" x2="820" y2="310" class="line"/>
  <line x1="990" y1="310" x2="1088" y2="310" class="line"/>
  <line x1="645" y1="370" x2="645" y2="470" class="dash"/>
  <line x1="730" y1="370" x2="840" y2="470" class="dash"/>
  <line x1="385" y1="350" x2="385" y2="470" class="dash"/>
  <text x="512" y="294" text-anchor="middle" class="small">Axios / JSON</text>
</svg>
