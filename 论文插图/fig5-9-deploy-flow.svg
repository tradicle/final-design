<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#475569;stroke-width:2;rx:14;ry:14}
      .text{font:20px 'Microsoft YaHei'; fill:#1f2937}
      .line{stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
      .title{font:700 26px 'Microsoft YaHei'; fill:#1f2937}
    </style>
  </defs>
  <text x="550" y="42" text-anchor="middle" class="title">系统部署流程图</text>
  <rect x="30" y="170" width="130" height="60" class="box"/><text x="95" y="207" text-anchor="middle" class="text">创建数据库</text>
  <rect x="195" y="170" width="130" height="60" class="box"/><text x="260" y="207" text-anchor="middle" class="text">导入 init.sql</text>
  <rect x="360" y="170" width="145" height="60" class="box"/><text x="432" y="207" text-anchor="middle" class="text">配置后端参数</text>
  <rect x="540" y="170" width="150" height="60" class="box"/><text x="615" y="207" text-anchor="middle" class="text">启动 Spring Boot</text>
  <rect x="725" y="170" width="130" height="60" class="box"/><text x="790" y="207" text-anchor="middle" class="text">启动 Vue 前端</text>
  <rect x="890" y="170" width="160" height="60" class="box"/><text x="970" y="207" text-anchor="middle" class="text">浏览器访问并验证</text>
  <line x1="160" y1="200" x2="195" y2="200" class="line"/>
  <line x1="325" y1="200" x2="360" y2="200" class="line"/>
  <line x1="505" y1="200" x2="540" y2="200" class="line"/>
  <line x1="690" y1="200" x2="725" y2="200" class="line"/>
  <line x1="855" y1="200" x2="890" y2="200" class="line"/>
</svg>
